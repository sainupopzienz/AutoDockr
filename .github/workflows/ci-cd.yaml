name: Build and Push Docker Image

on:
  push:
    branches:
      - dev   # This triggers the workflow on pushes to 'dev' branch

jobs:
  build:     # Job name, you can name it as "build" or any other name
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: v2
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: sainupopzienz/autodockr:${{ env.IMAGE_TAG }}
